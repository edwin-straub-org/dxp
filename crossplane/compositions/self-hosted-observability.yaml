apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: self-hosted-observability
  labels:
    crossplane.io/xrd: observabilitystacks.platform.muller.dxp.de
    provider: self-hosted
spec:
  compositeTypeRef:
    apiVersion: platform.muller.dxp.de/v1alpha1
    kind: ObservabilityStack
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # --- Prometheus + Grafana + Alertmanager ---
          - name: prometheus-stack
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              metadata:
                annotations:
                  crossplane.io/external-name: prometheus-stack
              spec:
                providerConfigRef:
                  name: local-cluster
                forProvider:
                  chart:
                    name: kube-prometheus-stack
                    repository: https://prometheus-community.github.io/helm-charts
                    version: "65.1.0"
                  namespace: observability
                  values:
                    prometheus:
                      prometheusSpec:
                        retention: "15d"
                        storageSpec:
                          volumeClaimTemplate:
                            spec:
                              accessModes:
                                - ReadWriteOnce
                              resources:
                                requests:
                                  storage: 5Gi
                        # Enable receiving remote-write from the OTel Collector
                        enableRemoteWriteReceiver: true
                    grafana:
                      enabled: true
                      adminPassword: "platform-admin"
                      service:
                        type: ClusterIP
                      sidecar:
                        datasources:
                          enabled: true
                      additionalDataSources:
                        - name: Loki
                          type: loki
                          access: proxy
                          url: http://loki-gateway:80
                          jsonData:
                            maxLines: 1000
                        - name: Tempo
                          type: tempo
                          access: proxy
                          url: http://tempo:3100
                          jsonData:
                            tracesToLogsV2:
                              datasourceUid: loki
                              filterByTraceID: true
                            tracesToMetrics:
                              datasourceUid: prometheus
                            serviceMap:
                              datasourceUid: prometheus
                            nodeGraph:
                              enabled: true
                    alertmanager:
                      enabled: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.namespace
                toFieldPath: spec.forProvider.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef
                toFieldPath: spec.providerConfigRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.retention.metrics
                toFieldPath: spec.forProvider.values.prometheus.prometheusSpec.retention
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.namespace
                  strategy: string
                  string:
                    fmt: "http://loki-gateway.%s.svc.cluster.local:80"
                toFieldPath: spec.forProvider.values.grafana.additionalDataSources[0].url
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.namespace
                  strategy: string
                  string:
                    fmt: "http://tempo.%s.svc.cluster.local:3100"
                toFieldPath: spec.forProvider.values.grafana.additionalDataSources[1].url

          # --- Loki (log aggregation) ---
          - name: loki
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              metadata:
                annotations:
                  crossplane.io/external-name: loki
              spec:
                providerConfigRef:
                  name: local-cluster
                forProvider:
                  chart:
                    name: loki
                    repository: https://grafana.github.io/helm-charts
                    version: "6.16.0"
                  namespace: observability
                  values:
                    loki:
                      auth_enabled: false
                      commonConfig:
                        replication_factor: 1
                      storage:
                        type: filesystem
                      schemaConfig:
                        configs:
                          - from: "2024-04-01"
                            store: tsdb
                            object_store: filesystem
                            schema: v13
                            index:
                              prefix: index_
                              period: 24h
                    deploymentMode: SingleBinary
                    singleBinary:
                      replicas: 1
                      persistence:
                        enabled: true
                        size: 5Gi
                    gateway:
                      enabled: true
                    backend:
                      replicas: 0
                    read:
                      replicas: 0
                    write:
                      replicas: 0
                    chunksCache:
                      enabled: false
                    resultsCache:
                      enabled: false
                    monitoring:
                      selfMonitoring:
                        enabled: false
                      lokiCanary:
                        enabled: false
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.namespace
                toFieldPath: spec.forProvider.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef
                toFieldPath: spec.providerConfigRef.name

          # --- Tempo (distributed tracing) ---
          - name: tempo
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              metadata:
                annotations:
                  crossplane.io/external-name: tempo
              spec:
                providerConfigRef:
                  name: local-cluster
                forProvider:
                  chart:
                    name: tempo
                    repository: https://grafana.github.io/helm-charts
                    version: "1.10.3"
                  namespace: observability
                  values:
                    tempo:
                      retention: "168h"  # 7 days
                      storage:
                        trace:
                          backend: local
                          local:
                            path: /var/tempo/traces
                          wal:
                            path: /var/tempo/wal
                      receivers:
                        otlp:
                          protocols:
                            grpc:
                              endpoint: "0.0.0.0:4317"
                            http:
                              endpoint: "0.0.0.0:4318"
                      metricsGenerator:
                        enabled: true
                        remoteWriteUrl: "http://prometheus-stack-kube-prom-prometheus:9090/api/v1/write"
                    persistence:
                      enabled: true
                      size: 5Gi
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.namespace
                toFieldPath: spec.forProvider.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef
                toFieldPath: spec.providerConfigRef.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.namespace
                  strategy: string
                  string:
                    fmt: "http://prometheus-stack-kube-prom-prometheus.%s.svc.cluster.local:9090/api/v1/write"
                toFieldPath: spec.forProvider.values.tempo.metricsGenerator.remoteWriteUrl

          # --- OpenTelemetry Collector (unified ingestion) ---
          - name: otel-collector
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              metadata:
                annotations:
                  crossplane.io/external-name: otel-collector
              spec:
                providerConfigRef:
                  name: local-cluster
                forProvider:
                  chart:
                    name: opentelemetry-collector
                    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
                    version: "0.73.1"
                  namespace: observability
                  values:
                    mode: deployment
                    replicaCount: 1
                    image:
                      repository: otel/opentelemetry-collector-contrib
                    ports:
                      otlp:
                        enabled: true
                        containerPort: 4317
                        servicePort: 4317
                        protocol: TCP
                      otlp-http:
                        enabled: true
                        containerPort: 4318
                        servicePort: 4318
                        protocol: TCP
                    config:
                      receivers:
                        otlp:
                          protocols:
                            grpc:
                              endpoint: "0.0.0.0:4317"
                            http:
                              endpoint: "0.0.0.0:4318"
                      processors:
                        batch:
                          timeout: 5s
                          send_batch_size: 1024
                        memory_limiter:
                          check_interval: 5s
                          limit_mib: 256
                          spike_limit_mib: 64
                      exporters:
                        # Metrics → Prometheus via remote write
                        prometheusremotewrite:
                          endpoint: "http://prometheus-stack-kube-prom-prometheus:9090/api/v1/write"
                          resource_to_telemetry_conversion:
                            enabled: true
                        # Traces → Tempo via OTLP
                        otlp/tempo:
                          endpoint: "tempo:4317"
                          tls:
                            insecure: true
                        # Logs → Loki via loki exporter
                        loki:
                          endpoint: "http://loki-gateway:80/loki/api/v1/push"
                      service:
                        pipelines:
                          traces:
                            receivers: [otlp]
                            processors: [memory_limiter, batch]
                            exporters: [otlp/tempo]
                          metrics:
                            receivers: [otlp]
                            processors: [memory_limiter, batch]
                            exporters: [prometheusremotewrite]
                          logs:
                            receivers: [otlp]
                            processors: [memory_limiter, batch]
                            exporters: [loki]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.namespace
                toFieldPath: spec.forProvider.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef
                toFieldPath: spec.providerConfigRef.name
              # Patch Prometheus remote write endpoint
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.namespace
                  strategy: string
                  string:
                    fmt: "http://prometheus-stack-kube-prom-prometheus.%s.svc.cluster.local:9090/api/v1/write"
                toFieldPath: spec.forProvider.values.config.exporters.prometheusremotewrite.endpoint
              # Patch Tempo endpoint
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.namespace
                  strategy: string
                  string:
                    fmt: "tempo.%s.svc.cluster.local:4317"
                toFieldPath: spec.forProvider.values.config.exporters.otlp/tempo.endpoint
              # Patch Loki endpoint
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.namespace
                  strategy: string
                  string:
                    fmt: "http://loki-gateway.%s.svc.cluster.local:80/loki/api/v1/push"
                toFieldPath: spec.forProvider.values.config.exporters.loki.endpoint

          # --- Promtail (node-level log shipping to Loki) ---
          - name: promtail
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              metadata:
                annotations:
                  crossplane.io/external-name: promtail
              spec:
                providerConfigRef:
                  name: local-cluster
                forProvider:
                  chart:
                    name: promtail
                    repository: https://grafana.github.io/helm-charts
                    version: "6.16.6"
                  namespace: observability
                  values:
                    config:
                      clients:
                        - url: "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.namespace
                toFieldPath: spec.forProvider.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef
                toFieldPath: spec.providerConfigRef.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.namespace
                  strategy: string
                  string:
                    fmt: "http://loki-gateway.%s.svc.cluster.local/loki/api/v1/push"
                toFieldPath: spec.forProvider.values.config.clients[0].url
